name: CI

on:
  push:
    branches:
      - main
      - hotfix/*
      - feature/*
      - release/*
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build project
        run: echo "Build project at $GITHUB_SHA"
